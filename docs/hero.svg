    <circle cx="345" cy="62" r="21"><animate attributeName="cy" values="62;54;62" dur="3s" begin="0.25s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/></circle>
    <circle cx="400" cy="48" r="29"><animate attributeName="cy" values="48;39;48" dur="3s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/></circle>
    <circle cx="455" cy="60" r="21"><animate attributeName="cy" values="60;52;60" dur="3s" begin="0.75s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/></circle>
