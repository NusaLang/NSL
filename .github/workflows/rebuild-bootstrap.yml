name: Build Bootstrap Engines

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to rebuild'
        required: true
        default: 'windows'
        type: choice
        options:
          - all
          - android
          - windows

permissions:
  contents: write

jobs:
  build-android:
    name: Rebuild Android Bootstrap Engine
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'android')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch engine source from tag
        run: |
          git fetch origin tag bootstrap-source
          git checkout bootstrap-source -- engine

      - name: Compile Android ARM64 engine
        run: |
          NDK_TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          $NDK_TOOLCHAIN/aarch64-linux-android24-clang++ \
            -std=gnu++17 -O3 -flto -D_GNU_SOURCE -D_USE_MATH_DEFINES -DNDEBUG -Wall -Wextra \
            -static-libstdc++ \
            -Iengine/include engine/src/*.cpp -o nusa-android-arm64 -ldl -lm
          $NDK_TOOLCHAIN/llvm-strip nusa-android-arm64

      - name: Verify static libc++ linkage
        run: |
          readelf -d nusa-android-arm64
          if readelf -d nusa-android-arm64 | grep -q "libc++_shared"; then
            echo "ERROR: libc++_shared.so is dynamically linked" >&2
            exit 1
          fi

      - name: Compute checksums and package
        run: |
          sha256sum nusa-android-arm64 > nusa-android-arm64.sha256
          mkdir -p dist/bundle
          cp nusa-android-arm64 dist/bundle/nusa-engine
          printf '#!/bin/sh\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexec "$DIR/nusa-engine" "$DIR/core/main.ns" "$@"\n' > dist/bundle/nusa
          chmod +x dist/bundle/nusa dist/bundle/nusa-engine
          cp -r core compiler std net crypto media lib Makefile README.md LICENSE NOTICE dist/bundle/
          tar -czf dist/nusa-android-arm64.tar.gz -C dist/bundle .
          cp nusa-android-arm64 dist/nusa-android-arm64
          cp nusa-android-arm64.sha256 dist/nusa-android-arm64.sha256
          cd dist
          sha256sum nusa-android-arm64.tar.gz > nusa-android-arm64.tar.gz.sha256

      - name: Update v0.0.1-build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.0.1-build --clobber nusa-android-arm64 nusa-android-arm64.sha256

      - name: Update v0.0.2-rc2 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.0.2-rc2 --clobber dist/nusa-android-arm64 dist/nusa-android-arm64.sha256 dist/nusa-android-arm64.tar.gz dist/nusa-android-arm64.tar.gz.sha256
          gh release edit v0.0.1-build --prerelease --latest=false
          gh release edit v0.0.2-rc2 --latest=true

  build-windows:
    name: Rebuild Windows Bootstrap Engine
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'windows')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch engine source from tag
        shell: bash
        run: |
          git fetch origin tag bootstrap-source
          git checkout bootstrap-source -- engine

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: >-
            base-devel
            gcc

      - name: Compile Windows x86_64 engine
        shell: msys2 {0}
        run: |
          make clean || true
          make -C engine clean || true
          make -C engine nusantara
          strip engine/nusantara.exe
          cp engine/nusantara.exe ./nusa-windows-x86_64.exe
          cp /usr/bin/msys-2.0.dll ./
          cp /usr/bin/msys-stdc++-6.dll ./ 2>/dev/null || true
          cp /usr/bin/msys-gcc_s-seh-1.dll ./ 2>/dev/null || true

      - name: Verify DLL dependencies
        shell: bash
        run: |
          export PATH="/c/msys64/usr/bin:$PATH"
          objdump -p nusa-windows-x86_64.exe | grep -i "DLL Name"

      - name: Compute checksums and package
        shell: bash
        run: |
          sha256sum nusa-windows-x86_64.exe > nusa-windows-x86_64.exe.sha256
          cp nusa-windows-x86_64.exe nusa-windows-x86_64
          sha256sum nusa-windows-x86_64 > nusa-windows-x86_64.sha256
          mkdir -p dist/bundle
          cp nusa-windows-x86_64.exe dist/bundle/nusa-engine.exe
          cp msys-2.0.dll dist/bundle/
          cp msys-stdc++-6.dll dist/bundle/ 2>/dev/null || true
          cp msys-gcc_s-seh-1.dll dist/bundle/ 2>/dev/null || true
          cat << 'EOF' > dist/bundle/nusa.cmd
          @echo off
          "%~dp0nusa-engine.exe" "%~dp0core\main.ns" %*
          EOF
          cat << 'EOF' > dist/bundle/nusa
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/nusa-engine.exe" "$DIR/core/main.ns" "$@"
          EOF
          chmod +x dist/bundle/nusa dist/bundle/nusa-engine.exe
          cp -r core compiler std net crypto media lib Makefile README.md LICENSE NOTICE install.ps1 dist/bundle/
          tar -czf dist/nusa-windows-x86_64.tar.gz -C dist/bundle .
          cd dist
          cp ../nusa-windows-x86_64.exe ./nusa-windows-x86_64.exe
          cp ../nusa-windows-x86_64 ./nusa-windows-x86_64
          cp ../msys-2.0.dll ./msys-2.0.dll 2>/dev/null || true
          sha256sum nusa-windows-x86_64.tar.gz > nusa-windows-x86_64.tar.gz.sha256
          sha256sum msys-2.0.dll > msys-2.0.dll.sha256 2>/dev/null || true

      - name: Update v0.0.1-build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload v0.0.1-build --clobber nusa-windows-x86_64.exe nusa-windows-x86_64.exe.sha256 nusa-windows-x86_64 nusa-windows-x86_64.sha256 msys-2.0.dll

      - name: Update v0.0.2-rc2 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload v0.0.2-rc2 --clobber dist/nusa-windows-x86_64* dist/msys-2.0.dll*
          gh release edit v0.0.1-build --prerelease --latest=false
          gh release edit v0.0.2-rc2 --latest=true
