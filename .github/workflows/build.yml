name: CI & Release

on:
  push:
    branches:
      - main
      - beta
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - beta

env:
  ENGINE_REF: bootstrap-source-2

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch engine source
        shell: bash
        run: |
          git fetch --depth 1 origin tag "$ENGINE_REF"
          git checkout "$ENGINE_REF" -- engine

      - name: Build engine from source
        run: |
          make -C engine nusantara LDFLAGS="-static-libstdc++ -static-libgcc -ldl -lm"
          strip engine/nusantara
          cp engine/nusantara nusa-engine
          chmod +x nusa-engine

      - name: Build and test toolchain
        run: |
          make build
          make test

      - name: Package Linux artifact
        run: |
          mkdir -p dist/bundle
          cp nusa-engine dist/nusa-linux-x86_64
          cp nusa-engine dist/bundle/nusa-engine
          cp nusa dist/bundle/nusa
          chmod +x dist/nusa-linux-x86_64 dist/bundle/nusa-engine dist/bundle/nusa
          cp -r core compiler std net crypto media lib examples Makefile README.md LICENSE NOTICE dist/bundle/
          tar -czf dist/nusa-linux-x86_64.tar.gz -C dist/bundle .
          cd dist && sha256sum nusa-linux-x86_64 > nusa-linux-x86_64.sha256
          sha256sum nusa-linux-x86_64.tar.gz > nusa-linux-x86_64.tar.gz.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusa-linux-x86_64
          path: dist/nusa-linux-x86_64*

  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch engine source
        shell: bash
        run: |
          git fetch --depth 1 origin tag "$ENGINE_REF"
          git checkout "$ENGINE_REF" -- engine

      - name: Build engine from source
        run: |
          make -C engine nusantara LDFLAGS="-static-libstdc++ -static-libgcc -ldl -lm"
          strip engine/nusantara
          cp engine/nusantara nusa-engine
          chmod +x nusa-engine

      - name: Build and test toolchain
        run: |
          make build
          make test

      - name: Package Linux ARM64 artifact
        run: |
          mkdir -p dist/bundle
          cp nusa-engine dist/nusa-linux-arm64
          cp nusa-engine dist/bundle/nusa-engine
          cp nusa dist/bundle/nusa
          chmod +x dist/nusa-linux-arm64 dist/bundle/nusa-engine dist/bundle/nusa
          cp -r core compiler std net crypto media lib examples Makefile README.md LICENSE NOTICE dist/bundle/
          tar -czf dist/nusa-linux-arm64.tar.gz -C dist/bundle .
          cd dist && sha256sum nusa-linux-arm64 > nusa-linux-arm64.sha256
          sha256sum nusa-linux-arm64.tar.gz > nusa-linux-arm64.tar.gz.sha256

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusa-linux-arm64
          path: dist/nusa-linux-arm64*

  build-android:
    name: Build Android (Termux ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch engine source
        shell: bash
        run: |
          git fetch --depth 1 origin tag "$ENGINE_REF"
          git checkout "$ENGINE_REF" -- engine

      - name: Build engine from source
        run: |
          NDK_TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          $NDK_TOOLCHAIN/aarch64-linux-android24-clang++ \
            -std=gnu++17 -O3 -flto -D_GNU_SOURCE -D_USE_MATH_DEFINES -DNDEBUG -Wall -Wextra \
            -static-libstdc++ \
            -Iengine/include engine/src/*.cpp -o nusa-engine -ldl -lm
          $NDK_TOOLCHAIN/llvm-strip nusa-engine
          if readelf -d nusa-engine | grep -q "libc++_shared"; then
            echo "ERROR: libc++_shared.so is dynamically linked" >&2
            exit 1
          fi
          printf '#!/bin/sh\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexec sh "$DIR/core/launcher.sh" "$DIR" "$@"\n' > nusa
          chmod +x nusa nusa-engine

      - name: Package Android ARM64 package
        run: |
          mkdir -p dist/bundle
          cp nusa-engine dist/nusa-android-arm64
          cp nusa-engine dist/bundle/nusa-engine
          cp nusa dist/bundle/nusa
          chmod +x dist/nusa-android-arm64 dist/bundle/nusa-engine dist/bundle/nusa
          cp -r core compiler std net crypto media lib examples Makefile README.md LICENSE NOTICE dist/bundle/
          tar -czf dist/nusa-android-arm64.tar.gz -C dist/bundle .
          cd dist && sha256sum nusa-android-arm64 > nusa-android-arm64.sha256
          sha256sum nusa-android-arm64.tar.gz > nusa-android-arm64.tar.gz.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusa-android-arm64
          path: dist/nusa-android-arm64*

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch engine source
        shell: bash
        run: |
          git fetch --depth 1 origin tag "$ENGINE_REF"
          git checkout "$ENGINE_REF" -- engine

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: >-
            base-devel
            gcc

      - name: Build engine from source
        shell: msys2 {0}
        run: |
          make -C engine nusantara
          strip engine/nusantara.exe
          cp engine/nusantara.exe ./nusa-engine.exe
          cp /usr/bin/msys-2.0.dll ./
          cp /usr/bin/msys-stdc++-6.dll ./ 2>/dev/null || true
          cp /usr/bin/msys-gcc_s-seh-1.dll ./ 2>/dev/null || true
          ./nusa-engine.exe core/main.ns --version

      - name: Package Windows artifact
        shell: bash
        run: |
          mkdir -p dist/bundle
          cp nusa-engine.exe dist/bundle/nusa-engine.exe
          cp nusa-engine.exe dist/nusa-windows-x86_64.exe
          cp msys-2.0.dll dist/bundle/
          cp msys-stdc++-6.dll dist/bundle/ 2>/dev/null || true
          cp msys-gcc_s-seh-1.dll dist/bundle/ 2>/dev/null || true
          cat << 'EOF' > dist/bundle/nusa.cmd
          @echo off
          "%~dp0nusa-engine.exe" "%~dp0core\main.ns" %*
          EOF
          cat << 'EOF' > dist/bundle/nusa
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/nusa-engine.exe" "$DIR/core/main.ns" "$@"
          EOF
          chmod +x dist/bundle/nusa dist/bundle/nusa-engine.exe dist/nusa-windows-x86_64.exe
          cp -r core compiler std net crypto media lib examples Makefile README.md LICENSE NOTICE install.ps1 dist/bundle/
          tar -czf dist/nusa-windows-x86_64.tar.gz -C dist/bundle .
          cd dist
          cp bundle/msys-2.0.dll ./msys-2.0.dll 2>/dev/null || true
          sha256sum nusa-windows-x86_64.exe > nusa-windows-x86_64.exe.sha256
          sha256sum nusa-windows-x86_64.tar.gz > nusa-windows-x86_64.tar.gz.sha256
          sha256sum msys-2.0.dll > msys-2.0.dll.sha256 2>/dev/null || true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusa-windows-x86_64
          path: dist/nusa-windows-x86_64*

  release:
    name: Release
    needs: [build-linux, build-linux-arm64, build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref, '-build')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        run: |
          cat << 'EOF' > release_notes.md
          ## NSL 0.0.2-rc4

          A self-hosted programming language with Indonesian and English keywords, bytecode VM, and native x86_64 and ARM64 compiler. `nusa file.ns` now compiles to a cached native binary and runs it, and the compiler has its own assembler and ELF writer, so builds need no `as`, `ld`, or C compiler.

          ### Install
          ```bash
          curl -fsSL https://github.com/NusaLang/NSL/raw/main/install.sh | bash
          ```
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
