name: CI & Release

on:
  push:
    branches:
      - main
      - beta
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - beta

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y binutils gcc g++ make

      - name: Build toolchain
        run: |
          make clean
          make build
          strip nusa-engine

      - name: Package Linux artifact
        run: |
          mkdir -p dist/bundle
          cp nusa-engine dist/nusa-linux-x86_64
          cp nusa-engine dist/bundle/nusa-engine
          cp nusa dist/bundle/nusa
          chmod +x dist/nusa-linux-x86_64 dist/bundle/nusa-engine dist/bundle/nusa
          cp -r core compiler std net crypto media lib Makefile README.md LICENSE NOTICE dist/bundle/
          tar -czf dist/nusa-linux-x86_64.tar.gz -C dist/bundle .
          cd dist && sha256sum nusa-linux-x86_64 > nusa-linux-x86_64.sha256
          sha256sum nusa-linux-x86_64.tar.gz > nusa-linux-x86_64.tar.gz.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusa-linux-x86_64
          path: dist/nusa-linux-x86_64*

  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update -y
          sudo apt-get install -y g++-aarch64-linux-gnu binutils-aarch64-linux-gnu make

      - name: Build toolchain
        run: |
          make clean
          make -C engine clean
          make -C engine nusantara CXX=aarch64-linux-gnu-g++
          aarch64-linux-gnu-strip engine/nusantara
          cp engine/nusantara nusa-engine
          printf '#!/bin/sh\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexec "$DIR/nusa-engine" "$DIR/core/main.ns" "$@"\n' > nusa
          chmod +x nusa nusa-engine

      - name: Package Linux ARM64 artifact
        run: |
          mkdir -p dist/bundle
          cp nusa-engine dist/nusa-linux-arm64
          cp nusa-engine dist/bundle/nusa-engine
          cp nusa dist/bundle/nusa
          chmod +x dist/nusa-linux-arm64 dist/bundle/nusa-engine dist/bundle/nusa
          cp -r core compiler std net crypto media lib Makefile README.md LICENSE NOTICE dist/bundle/
          tar -czf dist/nusa-linux-arm64.tar.gz -C dist/bundle .
          cd dist && sha256sum nusa-linux-arm64 > nusa-linux-arm64.sha256
          sha256sum nusa-linux-arm64.tar.gz > nusa-linux-arm64.tar.gz.sha256

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusa-linux-arm64
          path: dist/nusa-linux-arm64*

  build-android:
    name: Build Android (Termux ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build toolchain
        run: |
          make clean
          make -C engine clean
          NDK_TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          $NDK_TOOLCHAIN/aarch64-linux-android24-clang++ -std=c++17 -O3 -flto -DNDEBUG -Wall -Wextra -Iengine/include engine/src/*.cpp -o engine/nusantara -ldl -lm
          $NDK_TOOLCHAIN/llvm-strip engine/nusantara
          cp engine/nusantara nusa-engine
          printf '#!/bin/sh\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexec "$DIR/nusa-engine" "$DIR/core/main.ns" "$@"\n' > nusa
          chmod +x nusa nusa-engine

      - name: Package Android ARM64 package
        run: |
          mkdir -p dist/bundle
          cp nusa-engine dist/nusa-android-arm64
          cp nusa-engine dist/bundle/nusa-engine
          cp nusa dist/bundle/nusa
          chmod +x dist/nusa-android-arm64 dist/bundle/nusa-engine dist/bundle/nusa
          cp -r core compiler std net crypto media lib Makefile README.md LICENSE NOTICE dist/bundle/
          tar -czf dist/nusa-android-arm64.tar.gz -C dist/bundle .
          cd dist && sha256sum nusa-android-arm64 > nusa-android-arm64.sha256
          sha256sum nusa-android-arm64.tar.gz > nusa-android-arm64.tar.gz.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusa-android-arm64
          path: dist/nusa-android-arm64*

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: >-
            base-devel
            gcc

      - name: Build on Windows
        shell: msys2 {0}
        run: |
          make clean
          make -C engine clean
          make -C engine nusantara
          strip engine/nusantara.exe

      - name: Package Windows artifact
        shell: msys2 {0}
        run: |
          mkdir -p dist/bundle
          cp /usr/bin/msys-2.0.dll dist/bundle/ 2>/dev/null || true
          cp engine/nusantara.exe dist/bundle/nusa-engine.exe
          cp engine/nusantara.exe dist/nusa-windows-x86_64.exe
          cp engine/nusantara.exe dist/nusa-windows-x86_64
          cat << 'EOF' > dist/bundle/nusa.cmd
          @echo off
          "%~dp0nusa-engine.exe" "%~dp0core\main.ns" %*
          EOF
          cat << 'EOF' > dist/bundle/nusa
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/nusa-engine.exe" "$DIR/core/main.ns" "$@"
          EOF
          chmod +x dist/bundle/nusa dist/bundle/nusa-engine.exe dist/nusa-windows-x86_64.exe dist/nusa-windows-x86_64
          cp -r core compiler std net crypto media lib Makefile README.md LICENSE NOTICE install.ps1 dist/bundle/
          tar -czf dist/nusa-windows-x86_64.tar.gz -C dist/bundle .
          cd dist
          sha256sum nusa-windows-x86_64 > nusa-windows-x86_64.sha256
          sha256sum nusa-windows-x86_64.exe > nusa-windows-x86_64.exe.sha256
          sha256sum nusa-windows-x86_64.tar.gz > nusa-windows-x86_64.tar.gz.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusa-windows-x86_64
          path: dist/nusa-windows-x86_64*

  release:
    name: Release
    needs: [build-linux, build-linux-arm64, build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        run: |
          cat << 'EOF' > release_notes.md
          ## NSL 0.0.2-rc2

          A self-hosted programming language with Indonesian and English keywords, bytecode VM, and native x86-64 compiler.

          ### Install
          ```bash
          curl -fsSL https://github.com/NusaLang/NSL/raw/beta/install.sh | bash
          ```
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: false
